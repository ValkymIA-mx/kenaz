[package]
name = "kenaz-ui-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = false
license = "GPL-3.0-only"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "renderer-software", "accessibility"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "=1.18.1"
